services:
  db:
    image: postgres:16-alpine
    container_name: smartdrive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartdrive
      POSTGRES_USER: smartdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SdN2026SecurePass}
    volumes:
      - smartdrive_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdrive -d smartdrive"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartdrive-net

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: smartdrive-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartdrive:${POSTGRES_PASSWORD:-SdN2026SecurePass}@db:5432/smartdrive
      JWT_SECRET: ${JWT_SECRET:-5c549ef7d4b108a501902e471c0a9e623451855d04e60fdcc58996b247f717e8f7121719e43bc0b453063ef78323b6c786d5f058df2597445f308f6cab72668f}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-5c549ef7d4b108a501902e471c0a9e623451855d04e60fdcc58996b247f717e8f7121719e43bc0b453063ef78323b6c786d5f058df2597445f308f6cab72668f}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 30d
      NODE_ENV: production
      PORT: 3008
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-SmartDrive}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    ports:
      - "3008:3008"
    networks:
      - smartdrive-net

  nginx:
    image: nginx:alpine
    container_name: smartdrive-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - smartdrive-net

volumes:
  smartdrive_pgdata:

networks:
  smartdrive-net:
    driver: bridge
